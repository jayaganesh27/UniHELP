name: PHP syntax

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: php:8.2-cli
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l
